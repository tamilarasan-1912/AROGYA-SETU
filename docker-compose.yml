services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: arogya
      POSTGRES_USER: arogya
      POSTGRES_PASSWORD: arogya
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      HF_TOKEN: ${HF_TOKEN}
    ports: ["8000:8000"]
    depends_on: [postgres]
volumes:
  pgdata:
